<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | Brandora</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            margin: 0;
            background: #fff;
            color: #111;
            font-family: Arial, sans-serif;
        }

        .details-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 18px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #111;
            text-decoration: none;
        }

        .details-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .details-image {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: contain;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .details-thumbnails {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .details-thumbnails img {
            width: 65px;
            height: 75px;
            object-fit: contain;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }

        .details-title {
            font-size: 28px;
            margin: 10px 0;
        }

        .details-price {
            font-size: 24px;
            font-weight: bold;
            margin: 18px 0;
        }

        .details-description {
            line-height: 1.7;
            white-space: pre-wrap;
            margin: 20px 0;
        }

        .details-sizes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .size-option {
            padding: 9px 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }

        .size-option.selected {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        .details-button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .details-cart {
            background: #111;
            color: #fff;
        }

        .details-whatsapp {
            background: #25d366;
            color: #fff;
        }

        .details-button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .stock-message {
            margin: 15px 0;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .details-layout {
                grid-template-columns: 1fr;
                gap: 22px;
            }

            .details-container {
                margin: 15px auto;
                padding: 14px;
            }

            .details-title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <main class="details-container">

        <a class="back-link" href="index.html">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Shop
        </a>

        <div id="productDetails">
            <p>Loading product details...</p>
        </div>

    </main>

    <script>
    (() => {
        const PRODUCT_KEY = "local_store_products_v1";
        const SETTINGS_KEY = "local_store_settings_v1";
        const DB_URL =
            "https://brandora-82748-default-rtdb.firebaseio.com";

        const params = new URLSearchParams(location.search);
        const productId = params.get("id");

        const container = document.getElementById("productDetails");

        let selectedSize = "";
        let currentProduct = null;

        function getImages(product) {
            if (Array.isArray(product.images) && product.images.length) {
                return product.images.filter(Boolean);
            }

            return product.image ? [product.image] : [];
        }

        function getStock(product) {
            const stock = Number(product.stock ?? product.quantity ?? 1);
            return Number.isFinite(stock) ? stock : 1;
        }

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        function getLocalProducts() {
            try {
                const saved = JSON.parse(
                    localStorage.getItem(PRODUCT_KEY) || "[]"
                );

                return Array.isArray(saved) ? saved : [];
            } catch {
                return [];
            }
        }

        async function getProducts() {
            const localProducts = getLocalProducts();

            if (localProducts.some(p => String(p.id) === productId)) {
                return localProducts;
            }

            try {
                const response = await fetch(DB_URL + "/products.json");

                if (!response.ok) {
                    throw new Error("Could not load products");
                }

                const data = await response.json();

                let products = [];

                if (Array.isArray(data)) {
                    products = data.filter(Boolean);
                } else if (data && typeof data === "object") {
                    products = Object.entries(data).map(([key, value]) => ({
                        ...value,
                        id: value?.id ?? key
                    }));
                }

                if (products.length) {
                    localStorage.setItem(
                        PRODUCT_KEY,
                        JSON.stringify(products)
                    );
                }

                return products;
            } catch (error) {
                return localProducts;
            }
        }

        function renderProduct(product) {
            currentProduct = product;

            const images = getImages(product);
            const stock = getStock(product);

            const sizes = String(product.sizes || "")
                .split(",")
                .map(size => size.trim())
                .filter(Boolean);

            selectedSize = sizes.length ? sizes[0] : "";

            const mainImage = images[0] || "";

            const thumbnails = images.map((image, index) => `
                <img
                    src="${escapeHTML(image)}"
                    alt="Product image ${index + 1}"
                    data-image-index="${index}"
                >
            `).join("");

            const sizesHTML = sizes.map(size => `
                <button
                    type="button"
                    class="size-option ${size === selectedSize ? "selected" : ""}"
                    data-size="${escapeHTML(size)}"
                >${escapeHTML(size)}</button>
            `).join("");

            container.innerHTML = `
                <div class="details-layout">
                    <div>
                        <img
                            id="detailsMainImage"
                            class="details-image"
                            src="${escapeHTML(mainImage)}"
                            alt="${escapeHTML(product.name || "Product")}"
                        >

                        <div class="details-thumbnails">
                            ${thumbnails}
                        </div>
                    </div>

                    <div>
                        <p>${escapeHTML(product.category || "Imported")}</p>

                        <h1 class="details-title">
                            ${escapeHTML(product.name || "Product")}
                        </h1>

                        <div class="details-price">
                            Rs. ${Number(product.price || 0).toLocaleString()}
                        </div>

                        <div class="details-description">${escapeHTML(
                            product.description || "No description available."
                        )}</div>

                        ${sizes.length ? `
                            <h3>Select Size</h3>
                            <div class="details-sizes">${sizesHTML}</div>
                        ` : ""}

                        <p class="stock-message" id="detailsStock">
                            ${stock > 0
                                ? `In stock: ${stock} piece(s)`
                                : "Sold out"}
                        </p>

                        <button
                            type="button"
                            id="detailsAddCart"
                            class="details-button details-cart"
                            ${stock <= 0 ? "disabled" : ""}
                        >Add to Cart</button>

                        <button
                            type="button"
                            id="detailsWhatsApp"
                            class="details-button details-whatsapp"
                            ${stock <= 0 ? "disabled" : ""}
                        >
                            <i class="fa-brands fa-whatsapp"></i>
                            Order on WhatsApp
                        </button>
                    </div>
                </div>
            `;

            container.querySelectorAll("[data-image-index]").forEach(image => {
                image.addEventListener("click", () => {
                    document.getElementById("detailsMainImage").src =
                        images[Number(image.dataset.imageIndex)];
                });
            });

            container.querySelectorAll("[data-size]").forEach(button => {
                button.addEventListener("click", () => {
                    selectedSize = button.dataset.size;

                    container.querySelectorAll("[data-size]").forEach(item => {
                        item.classList.toggle("selected", item === button);
                    });
                });
            });

            document.getElementById("detailsAddCart")
                .addEventListener("click", () => {
                    alert(
                        "Product details are loaded. Cart connection will be completed in the next step."
                    );
                });

            document.getElementById("detailsWhatsApp")
                .addEventListener("click", orderOnWhatsApp);
        }

        function orderOnWhatsApp() {
            if (!currentProduct) return;

            let settings = {};

            try {
                settings = JSON.parse(
                    localStorage.getItem(SETTINGS_KEY) || "{}"
                );
            } catch {}

            const phone = String(
                settings.whatsapp || settings.whatsappNumber || ""
            ).replace(/\D/g, "");

            if (!phone) {
                alert("WhatsApp number is not configured in store settings yet.");
                return;
            }

            const message = [
                "Assalam-o-Alaikum, I want to order this Brandora product:",
                "Product: " + (currentProduct.name || ""),
                "Price: Rs. " + Number(currentProduct.price || 0).toLocaleString(),
                selectedSize ? "Size: " + selectedSize : "",
                "Product link: " + location.href
            ].filter(Boolean).join("\n");

            window.open(
                "https://wa.me/" + phone + "?text=" +
                encodeURIComponent(message),
                "_blank"
            );
        }

        async function init() {
            if (!productId) {
                container.innerHTML = "<p>Product ID is missing. Please return to the shop.</p>";
                return;
            }

            const products = await getProducts();

            const product = products.find(
                item => String(item.id) === productId
            );

            if (!product) {
                container.innerHTML =
                    "<p>Product not found. Please return to the shop and try again.</p>";
                return;
            }

            renderProduct(product);
        }

        init();
    })();
    </script>
</body>
    </html>
